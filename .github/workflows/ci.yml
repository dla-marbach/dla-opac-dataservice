# Läuft bei jedem Pull Request nach main und nach jedem Merge auf main.
# Im PR müssen alle Jobs vor dem Merge grün sein. Ein roter Lauf auf main
# wird umgehend per Ticket und Fix-PR behoben, vor jedem Release muss er grün sein.
# Actions sind per Commit-SHA gepinnt (Tags lassen sich verschieben, SHAs nicht),
# Dependabot aktualisiert SHA und Kommentar.
# Kein Container-Betrieb: Image-Build, Image-Scan und Smoketest entfallen
# (siehe „Projekte ohne Container-Betrieb“ in der DevOps-Vorlage).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PHP 8.3 und Composer bringt das Runner-Image mit (wie empfohlen für den
      # Server), deshalb ohne zusätzliche Action.
      - name: PHP-Version
        run: php --version && composer --version
      - name: Abhängigkeiten installieren
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Tests
        run: vendor/bin/phpunit
      - name: Shell-Skripte prüfen
        run: shellcheck *.sh

  psalm:
    name: Psalm (Sicherheitsanalyse)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Container-Action mit festem Versionstag. Schlägt bei Funden fehl.
      - name: Psalm
        uses: docker://ghcr.io/psalm/psalm-github-actions:6.16.1
        with:
          security_analysis: true
          report_file: results.sarif
          composer_require_dev: true
          composer_ignore_platform_reqs: true
      # Auch bei Funden hochladen, damit sie unter „Security“ → „Code scanning“ stehen.
      - name: Ergebnisse hochladen
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

  trivy-repo:
    name: Trivy (Repo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Erst alle Schweregrade ausgeben (ohne Fehlschlag, auch in der Job-Zusammenfassung),
      # dann nur HIGH und CRITICAL prüfen. Der zweite Lauf nutzt Trivy und
      # Datenbank aus dem ersten.
      # Ohne ignore-unfixed: Funde in App-Abhängigkeiten werden immer gemeldet.
      # Ohne version: Die Action bringt eine feste Trivy-Version mit, Dependabot aktualisiert beides.
      - name: Repo scannen, alle Schweregrade (Abhängigkeiten, Secrets, Konfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          output: ${{ runner.temp }}/trivy-repo.txt
      - name: Ergebnis ausgeben
        run: |
          cat "$RUNNER_TEMP/trivy-repo.txt"
          {
            echo "### Trivy (Repo): alle Schweregrade"
            echo '```'
            cat "$RUNNER_TEMP/trivy-repo.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Repo prüfen (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
          cache: false
